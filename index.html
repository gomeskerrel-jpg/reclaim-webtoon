<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECLAIM — A Webtoon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #D4A843;
    --gold-glow: #F5D778;
    --dark: #0D0D0D;
    --darker: #060606;
    --gray: #1A1A1A;
    --text: #E8E0D4;
    --text-dim: #8A8278;
    --accent: #C4953A;
  }

  body {
    background: var(--darker);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* ===== LANDING SCREEN ===== */
  #landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center bottom, #1a1208 0%, var(--darker) 70%);
    text-align: center;
    padding: 2rem;
  }

  #landing h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4rem, 12vw, 10rem);
    letter-spacing: 0.15em;
    color: var(--gold);
    text-shadow: 0 0 60px rgba(212, 168, 67, 0.3), 0 0 120px rgba(212, 168, 67, 0.1);
    margin-bottom: 0.5rem;
    animation: titlePulse 3s ease-in-out infinite;
  }

  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 60px rgba(212, 168, 67, 0.3), 0 0 120px rgba(212, 168, 67, 0.1); }
    50% { text-shadow: 0 0 80px rgba(212, 168, 67, 0.5), 0 0 160px rgba(212, 168, 67, 0.2); }
  }

  #landing .tagline {
    font-family: 'Noto Serif', serif;
    font-style: italic;
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    color: var(--text-dim);
    margin-bottom: 3rem;
    max-width: 500px;
  }

  .episode-grid {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
    max-width: 400px;
  }

  .episode-btn {
    background: linear-gradient(135deg, var(--gray) 0%, #111 100%);
    border: 1px solid rgba(212, 168, 67, 0.2);
    border-radius: 12px;
    padding: 1.2rem 1.5rem;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .episode-btn:hover {
    border-color: var(--gold);
    background: linear-gradient(135deg, #1a1508 0%, #111 100%);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(212, 168, 67, 0.15);
  }

  .episode-btn .ep-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: var(--gold);
    min-width: 50px;
  }

  .episode-btn .ep-info h3 {
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 0.2rem;
  }

  .episode-btn .ep-info p {
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .episode-btn.locked {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ===== READER VIEW ===== */
  #reader {
    display: none;
    min-height: 100vh;
    background: var(--dark);
  }

  .reader-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: linear-gradient(180deg, var(--darker) 0%, transparent 100%);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: opacity 0.3s;
  }

  .reader-header.hidden { opacity: 0; pointer-events: none; }

  .back-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    color: var(--text);
    padding: 0.5rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: 'Inter', sans-serif;
  }

  .back-btn:hover { background: rgba(255,255,255,0.2); }

  .reader-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    color: var(--gold);
    letter-spacing: 0.1em;
  }

  .panel-counter {
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  /* ===== PANELS ===== */
  .panels-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 60px 0 100px;
  }

  .panel {
    width: 100%;
    margin-bottom: 0;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .panel.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .panel img {
    width: 100%;
    display: block;
  }

  /* Text panels for dialogue-heavy scenes */
  .panel-text {
    padding: 2rem clamp(1.5rem, 5vw, 4rem);
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  .panel-text.dark-bg { background: var(--darker); }
  .panel-text.warm-bg { background: linear-gradient(180deg, #1a1508 0%, var(--darker) 100%); }
  .panel-text.dramatic { background: linear-gradient(180deg, #0a0a0a 0%, #1a0a00 50%, #0a0a0a 100%); }

  .narration {
    font-family: 'Noto Serif', serif;
    font-style: italic;
    font-size: clamp(1rem, 3vw, 1.3rem);
    line-height: 1.8;
    color: var(--text-dim);
    max-width: 600px;
    margin: 0 auto;
    text-align: center;
  }

  .narration em { color: var(--gold); font-style: italic; }

  .dialogue {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 3vw, 1.2rem);
    line-height: 1.8;
    max-width: 600px;
    margin: 0 auto;
  }

  .dialogue .speaker {
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    font-size: 0.8em;
    letter-spacing: 0.1em;
    margin-top: 1.2rem;
  }

  .dialogue .speaker:first-child { margin-top: 0; }
  .dialogue .line { color: var(--text); margin-top: 0.3rem; }

  /* Splash text overlay */
  .panel-splash {
    position: relative;
    overflow: hidden;
  }

  .panel-splash .overlay-text {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 3rem 2rem 2rem;
    background: linear-gradient(transparent 0%, rgba(0,0,0,0.85) 100%);
  }

  .panel-splash .overlay-text .narration {
    color: #fff;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  }

  /* Chapter title cards */
  .chapter-card {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a1508 0%, var(--darker) 70%);
    text-align: center;
    padding: 3rem;
  }

  .chapter-card .ep-number {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.9rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 1rem;
  }

  .chapter-card h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 10vw, 6rem);
    color: var(--gold);
    letter-spacing: 0.1em;
    text-shadow: 0 0 40px rgba(212, 168, 67, 0.3);
    margin-bottom: 1.5rem;
  }

  .chapter-card .epigraph {
    font-family: 'Noto Serif', serif;
    font-style: italic;
    font-size: clamp(0.9rem, 2.5vw, 1.1rem);
    color: var(--text-dim);
    max-width: 500px;
    line-height: 1.6;
  }

  /* End card */
  .end-card {
    min-height: 40vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem;
    background: var(--darker);
  }

  .end-card h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-bottom: 1rem;
  }

  .end-card .next-title {
    font-family: 'Noto Serif', serif;
    font-style: italic;
    color: var(--gold);
    font-size: 1.2rem;
    margin-bottom: 2rem;
  }

  .next-ep-btn {
    background: linear-gradient(135deg, var(--gold) 0%, var(--accent) 100%);
    border: none;
    color: var(--darker);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 0.15em;
    padding: 0.8rem 2.5rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .next-ep-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(212, 168, 67, 0.3);
  }

  /* Progress bar */
  .progress-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--gold-glow));
    z-index: 100;
    transition: width 0.1s linear;
    box-shadow: 0 0 10px rgba(212, 168, 67, 0.5);
  }

  /* Placeholder for missing images */
  .panel-placeholder {
    width: 100%;
    aspect-ratio: 9/16;
    background: linear-gradient(135deg, var(--gray) 0%, #111 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
    border: 1px dashed rgba(212, 168, 67, 0.2);
  }

  .panel-placeholder .placeholder-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: var(--gold);
    opacity: 0.4;
  }

  .panel-placeholder .placeholder-desc {
    font-size: 0.85rem;
    color: var(--text-dim);
    max-width: 300px;
    text-align: center;
    line-height: 1.5;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .panels-container { padding: 50px 0 80px; }
    .panel-text { padding: 1.5rem 1.2rem; }
  }
</style>
</head>
<body>

<!-- ===== LANDING ===== -->
<div id="landing">
  <h1>RECLAIM</h1>
  <p class="tagline">"They kept telling me I wasn't the right type. I kept proving there's no such thing."</p>

  <div class="episode-grid">
    <button class="episode-btn" onclick="loadEpisode(1)">
      <span class="ep-num">01</span>
      <div class="ep-info">
        <h3>The Board</h3>
        <p>The Iron Ward. Chess. The first spark.</p>
      </div>
    </button>

    <button class="episode-btn" onclick="loadEpisode(2)">
      <span class="ep-num">02</span>
      <div class="ep-info">
        <h3>The Crossing</h3>
        <p>Concrete to green. A new world.</p>
      </div>
    </button>

    <button class="episode-btn" onclick="loadEpisode(3)">
      <span class="ep-num">03</span>
      <div class="ep-info">
        <h3>Not Technical Enough</h3>
        <p>The highest score. The closed door. The fire.</p>
      </div>
    </button>

    <button class="episode-btn" onclick="loadEpisode(4)">
      <span class="ep-num">04</span>
      <div class="ep-info">
        <h3>Iron Sharpens Iron</h3>
        <p>The Verdant Reach. High school. The crew. The mat.</p>
      </div>
    </button>
  </div>
</div>

<!-- ===== READER ===== -->
<div id="reader">
  <div class="reader-header" id="readerHeader">
    <button class="back-btn" onclick="backToMenu()">Back</button>
    <span class="reader-title" id="readerTitle">RECLAIM</span>
    <span class="panel-counter" id="panelCounter"></span>
  </div>
  <div class="panels-container" id="panelsContainer"></div>
  <div class="progress-bar" id="progressBar"></div>
</div>

<script>
// ============================================================
// EPISODE DATA
// Each episode is an array of panel objects.
// Types: "image", "text", "chapter-card", "splash", "end"
//
// TO ADD YOUR AI ART:
// 1. Create a folder called "images" next to this HTML file
// 2. Save your DALL-E images as: EP01-P01.png, EP01-P02.png, etc.
// 3. Change the "src" field in the panel data below to match
// 4. Panels with no image will show a placeholder with description
// ============================================================

const episodes = {
  1: {
    title: "The Board",
    epigraph: '"In the Iron Ward, you learn to see the whole board before you make a move."',
    panels: [
      // CHAPTER CARD (auto-generated)
      { type: "chapter-card" },

      // SPLASH — The Iron Ward
      { type: "splash", src: "images/EP01-P01.png",
        desc: "Bird's eye view of the Iron Ward — dense concrete towers, narrow streets, morning gold light",
        narration: "The Iron Ward. Built on concrete. Held together by something stronger." },

      // Text — narration
      { type: "text", bg: "warm-bg",
        narration: "The outside world called it dangerous. They weren't wrong. But they weren't right either. Dangerous is just another word for <em>alive</em>." },

      // The Ashvane apartment
      { type: "image", src: "images/EP01-P02.png",
        desc: "Inside a small but immaculate apartment — family photos, a woman cooking, warmth" },

      // Great-Gran + Kai walking
      { type: "image", src: "images/EP01-P03.png",
        desc: "Great-Gran and 6-year-old Kai walking through the Iron Ward, hand in hand" },

      // Dialogue — Great-Gran teaches
      { type: "text", bg: "warm-bg", dialogue: [
        { speaker: "Great-Gran", line: "You know what chess is?" },
        { speaker: "Kai", line: "It's a game with kings and stuff." },
        { speaker: "Great-Gran", line: "Mm. It's more than that. Chess is how you see the whole picture. Most people look at what's in front of them. Chess teaches you to see what's underneath. What's behind. What's coming." }
      ]},

      // SPLASH — The Board plaza
      { type: "splash", src: "images/EP01-P04.png",
        desc: "The Board — open chess plaza between four iron towers, old men playing, golden light like a cathedral",
        narration: "" },

      // First chess game
      { type: "image", src: "images/EP01-P05.png",
        desc: "6-year-old Kai across the stone table from Mr. Barry, feet dangling, crowd gathering" },

      // Dialogue — the game
      { type: "text", bg: "dark-bg", dialogue: [
        { speaker: "Mr. Barry", line: "That's a knight. Moves in an L. Most unpredictable piece on the board. Because it doesn't move in straight lines. Everything else goes forward, backward, diagonal. The knight jumps." },
        { speaker: "Kai", line: "That's my piece." },
        { speaker: "Mr. Barry", line: "Yeah? Show me." }
      ]},

      // SPLASH — Pulse awakening at the chess board
      { type: "splash", src: "images/EP01-P06.png",
        desc: "Chess pieces glowing gold — Pulse vision. Kai's eyes with gold rings. Only he can see it.",
        narration: "" },

      // Dialogue — Mr. Barry stunned
      { type: "text", bg: "dark-bg", dialogue: [
        { speaker: "Mr. Barry", line: "...Boy. Where did you learn that?" },
        { speaker: "Kai", line: "Learn what? I just moved where it was brightest." }
      ]},

      // The boxing gym
      { type: "image", src: "images/EP01-P07.png",
        desc: "Basement gym — concrete walls, heavy bag. 7-year-old Kai faces Coach Reeves" },

      // Dialogue — Coach Reeves
      { type: "text", bg: "dark-bg", dialogue: [
        { speaker: "Coach Reeves", line: "You're the chess kid." },
        { speaker: "Kai", line: "Yes ma'am." },
        { speaker: "Coach Reeves", line: "Chess won't help you when someone puts hands on you." },
        { speaker: "Kai", line: "Mr. Barry says chess helps with everything." },
        { speaker: "Coach Reeves", line: "Mr. Barry ever been in a fight?" },
        { speaker: "Kai", line: "...He says he fights every day. Just with his brain." }
      ]},

      // Training montage
      { type: "image", src: "images/EP01-P08.png",
        desc: "Triple montage — jiu-jitsu on mats, heavy bag, chess with Mr. Barry" },

      // Narration
      { type: "text", bg: "warm-bg",
        narration: "Chess taught my mind. The gym taught my body. I was learning two languages at once. Strategy and force. The mind and the body. I didn't know it then, but most people only speak one." },

      // SPLASH — Great-Gran's revelation
      { type: "splash", src: "images/EP01-P09.png",
        desc: "Great-Gran holding Kai's face, fire in her eyes. Chess knight glowing gold on the floor between them.",
        narration: "" },

      // Dialogue — The sacred moment
      { type: "text", bg: "dramatic", dialogue: [
        { speaker: "Great-Gran", line: "Listen to me, Kai Ashvane. You see what's underneath. The world is going to try and tell you that isn't real. That you don't fit. That you're not the right kind of smart, or the right kind of strong, or the right kind of anything." },
        { speaker: "", line: "" },
        { speaker: "Great-Gran", line: "Don't you ever let them. You hear me? Not EVER." }
      ]},

      // Final narration
      { type: "text", bg: "dark-bg",
        narration: "I was seven years old when someone told me what I was. I've spent every day since proving her right." },

      // END
      { type: "end", nextEp: 2, nextTitle: "The Crossing" }
    ]
  },

  2: {
    title: "The Crossing",
    epigraph: '"I thought the Iron Ward was the whole world. Then the world got bigger."',
    panels: [
      { type: "chapter-card" },

      // Leaving
      { type: "splash", src: "images/EP02-P01.png",
        desc: "Moving van pulling away from the Iron Ward — Kai's hand pressed against the rear window",
        narration: "I didn't know then that you carry where you're from in your bones. I thought I was leaving the Ward behind." },

      // Mr. Barry farewell
      { type: "text", bg: "warm-bg", dialogue: [
        { speaker: "Mr. Barry", line: "You're not just Iron Ward. You're something else. You'll fit wherever you plant." },
        { speaker: "Kai", line: "I'll come back." },
        { speaker: "Mr. Barry", line: "I know you will. But don't rush. The Ward will be here. Go see what else there is." }
      ]},

      // Great-Gran farewell
      { type: "text", bg: "dramatic", dialogue: [
        { speaker: "Great-Gran", line: "You remember what I told you?" },
        { speaker: "Kai", line: "I see what's underneath." },
        { speaker: "Great-Gran", line: "And what else?" },
        { speaker: "Kai", line: "...Don't let them tell me it isn't real." },
        { speaker: "Great-Gran", line: "Go, baby. The world's bigger than these walls. Go see it." }
      ]},

      // SPLASH — Trees
      { type: "splash", src: "images/EP02-P02.png",
        desc: "Through a car window — vast forest, green to the horizon. Kai's wonder-struck face reflected in glass.",
        narration: "I thought the Iron Ward was the whole world. Then I saw the trees. And I realized the world wasn't small — I was." },

      // Pops conversation
      { type: "text", bg: "dark-bg", dialogue: [
        { speaker: "Kai", line: "Pops? Are the people nice here?" },
        { speaker: "Pops", line: "Most of 'em. Yeah. Most of 'em are real nice." },
        { speaker: "Kai", line: "What about the ones who aren't?" },
        { speaker: "Pops", line: "...You'll know 'em when you see 'em. Same way you know anything — you pay attention. But Kai. Don't let the bad ones make you forget the good ones. There's more good. Always." }
      ]},

      // Stars
      { type: "splash", src: "images/EP02-P03.png",
        desc: "Kai at a window at night — sky full of stars, Milky Way visible. Chess knight glowing on nightstand.",
        narration: "" },

      // The cold moment
      { type: "text", bg: "dark-bg", dialogue: [
        { speaker: "Kai", line: "Moms? That lady... She didn't like us. But she doesn't even know us." },
        { speaker: "Moms", line: "Some people decide what you are before you open your mouth. Their eyes are broken. Not yours." },
        { speaker: "Moms", line: "I don't care what they say you are. I know what you are." }
      ]},

      // Meeting Greg and Alex
      { type: "image", src: "images/EP02-P04.png",
        desc: "School cafeteria — Kai, Greg, and Alex meeting for the first time. Greg energetic, Alex calm." },

      { type: "text", bg: "warm-bg", dialogue: [
        { speaker: "Greg", line: "You play any sports?" },
        { speaker: "Kai", line: "Boxing. Jiu-jitsu." },
        { speaker: "Greg", line: "For real? Like fighting?" },
        { speaker: "Kai", line: "Like discipline." },
        { speaker: "Alex", line: "I'm Alex. That's Greg. We play soccer." },
        { speaker: "Kai", line: "I don't know anything about soccer." },
        { speaker: "Greg", line: "We don't know anything about punching people. ...This could work." }
      ]},

      // Parallel training
      { type: "image", src: "images/EP02-P05.png",
        desc: "Split panel — Greg and Alex on soccer field / Kai alone at the heavy bag. Same fire, different disciplines." },

      { type: "text", bg: "dark-bg",
        narration: "They trained together. I trained alone. Different disciplines. Same fire. I didn't know it then, but I'd just met two people I'd carry with me for the rest of my life." },

      // Final
      { type: "text", bg: "warm-bg",
        narration: "The Iron Ward taught me to read the board. The Verdant Reach was about to teach me that the board is bigger than I ever imagined. New territory. New rules. Same fire." },

      { type: "end", nextEp: 3, nextTitle: "Not Technical Enough" }
    ]
  },

  3: {
    title: "Not Technical Enough",
    epigraph: '"The first time they tell you what you\'re not, it cuts. Every time after that, it\'s fuel."',
    panels: [
      { type: "chapter-card" },

      // Kai at 12
      { type: "splash", src: "images/EP03-P01.png",
        desc: "Kai at 12 — athletic, confident, chess knight pin on collar. Academy entrance behind him.",
        narration: "Three years. The soft ground didn't stay soft. It became foundation." },

      // Narration — training
      { type: "text", bg: "dark-bg",
        narration: "Chess taught my mind. The gym taught my body. Math taught me that both speak the same language — <em>patterns</em>. Greg was speed. Alex was strategy. I was both — plus something else I couldn't name yet." },

      // Exam
      { type: "image", src: "images/EP03-P02.png",
        desc: "Kai writing rapidly in exam hall — calm while others stress. Faint gold shimmer in his eyes." },

      // SPLASH — Pulse during exam
      { type: "splash", src: "images/EP03-P03.png",
        desc: "Dual reality — normal exam room above, Pulse vision below. Glowing gold web of connected problems.",
        narration: "" },

      // Scores posted
      { type: "image", src: "images/EP03-P04.png",
        desc: "Scoreboard — Greg and Alex pointing at the top. Kai is #1. Shock and pride on their faces." },

      { type: "text", bg: "warm-bg", dialogue: [
        { speaker: "Greg", line: "BRO. NUMBER ONE. YOU'RE NUMBER ONE!" },
        { speaker: "Alex", line: "That's AG for sure. First pick." }
      ]},

      { type: "text", bg: "dark-bg",
        narration: "I earned that. Every chess game, every round on the bag, every equation solved. That score was mine." },

      // SPLASH — The office
      { type: "splash", src: "images/EP03-P05.png",
        desc: "The office — Dodd behind desk, Kai across. The moment of impact. His confidence cracking. The open folder showing #1 scores.",
        narration: "" },

// ============================================================
// RENDERING ENGINE
// ============================================================

let currentEpisode = null;
let headerTimeout = null;

function loadEpisode(epNum) {
  const ep = episodes[epNum];
  if (!ep) return;
  currentEpisode = epNum;

  document.getElementById('landing').style.display = 'none';
  document.getElementById('reader').style.display = 'block';
  document.getElementById('readerTitle').textContent = `EP ${String(epNum).padStart(2,'0')} \u2014 ${ep.title}`;

  const container = document.getElementById('panelsContainer');
  container.innerHTML = '';

  ep.panels.forEach((panel, i) => {
    const el = createPanel(panel, epNum, i);
    container.appendChild(el);
  });

  window.scrollTo(0, 0);
  observePanels();
  updateProgress();
}

function createPanel(panel, epNum, index) {
  const div = document.createElement('div');
  div.className = 'panel';
  div.dataset.index = index;

  switch (panel.type) {
    case 'chapter-card': {
      const ep = episodes[epNum];
      div.innerHTML = `
        <div class="chapter-card">
          <div class="ep-number">Episode ${String(epNum).padStart(2, '0')}</div>
          <h2>${ep.title}</h2>
          <div class="epigraph">${ep.epigraph}</div>
        </div>`;
      break;
    }

    case 'splash': {
      div.classList.add('panel-splash');
      if (panel.src) {
        const img = document.createElement('img');
        img.src = panel.src;
        img.alt = panel.desc;
        img.onerror = function() {
          this.replaceWith(makePlaceholder('SPLASH PAGE', panel.desc));
        };
        div.appendChild(img);
        if (panel.narration) {
          const overlay = document.createElement('div');
          overlay.className = 'overlay-text';
          overlay.innerHTML = `<p class="narration">${panel.narration}</p>`;
          div.appendChild(overlay);
        }
      } else {
        div.appendChild(makePlaceholder('SPLASH PAGE', panel.desc));
      }
      break;
    }

    case 'image': {
      if (panel.src) {
        const img = document.createElement('img');
        img.src = panel.src;
        img.alt = panel.desc;
        img.onerror = function() {
          this.replaceWith(makePlaceholder('PANEL', panel.desc));
        };
        div.appendChild(img);
      } else {
        div.appendChild(makePlaceholder('PANEL', panel.desc));
      }
      break;
    }

    case 'text': {
      let content = '';
      if (panel.narration) {
        content = `<p class="narration">${panel.narration}</p>`;
      }
      if (panel.dialogue) {
        content = '<div class="dialogue">';
        panel.dialogue.forEach(d => {
          if (d.speaker) content += `<div class="speaker">${d.speaker}</div>`;
          if (d.line) content += `<div class="line">${d.line}</div>`;
        });
        content += '</div>';
      }
      div.innerHTML = `<div class="panel-text ${panel.bg || ''}">${content}</div>`;
      break;
    }

    case 'end': {
      div.innerHTML = `
        <div class="end-card">
          <h3>End of Episode ${currentEpisode}</h3>
          ${panel.nextTitle ? `
            <div class="next-title">Next: "${panel.nextTitle}"</div>
            ${episodes[panel.nextEp] ? `<button class="next-ep-btn" onclick="loadEpisode(${panel.nextEp})">READ NEXT</button>` : `<button class="next-ep-btn" style="opacity:0.4;cursor:not-allowed" disabled>COMING SOON</button>`}
          ` : ''}
        </div>`;
      break;
    }
  }

  return div;
}

function makePlaceholder(label, desc) {
  const el = document.createElement('div');
  el.className = 'panel-placeholder';
  el.innerHTML = `<div class="placeholder-label">${label}</div><div class="placeholder-desc">${desc}</div>`;
  return el;
}

function backToMenu() {
  document.getElementById('reader').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
  currentEpisode = null;
}

// Scroll reveal
function observePanels() {
  const panels = document.querySelectorAll('.panel');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

  panels.forEach(p => observer.observe(p));
}

// Progress bar
function updateProgress() {
  window.addEventListener('scroll', () => {
    if (!currentEpisode) return;
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = Math.min((scrollTop / docHeight) * 100, 100);
    document.getElementById('progressBar').style.width = progress + '%';

    // Auto-hide header on scroll
    clearTimeout(headerTimeout);
    document.getElementById('readerHeader').classList.remove('hidden');
    headerTimeout = setTimeout(() => {
      if (scrollTop > 200) {
        document.getElementById('readerHeader').classList.add('hidden');
      }
    }, 2000);
  });
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && currentEpisode) backToMenu();
});
